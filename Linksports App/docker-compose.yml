version: "3.9"

# ─── Docker Compose for LinkSports Migration ─────────────────────────────────
# Spins up:
#   1. mysql8   – temporary MySQL instance to load the legacy dump
#   2. mongo    – MongoDB 7 (mirrors your Atlas setup for local dev)
#   3. mongo-express – optional web UI for MongoDB
#
# Set MYSQL_ROOT_PASSWORD, MYSQL_PASSWORD, MONGO_ROOT_PASSWORD, MONGO_APP_PASSWORD and MONGO_EXPRESS_PASSWORD (long and random) first.
# All ports are bound to 127.0.0.1 so the databases are never reachable from the network.
#
# Usage:
#   docker compose up -d          # start all services
#   docker compose logs -f        # tail logs
#   docker compose down -v        # stop + remove volumes
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Legacy MySQL (source for migration) ─────────────────────────────────────
  mysql8:
    image: mysql:8.0
    container_name: linksports_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: linksports
      MYSQL_USER: linksports
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"   # local machine only: never expose a database to the network
    volumes:
      # Automatically import a SQL dump placed at ./dump/linksports_dump.sql
      - ./dump:/docker-entrypoint-initdb.d:ro
      - mysql_data:/var/lib/mysql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --sql_mode=NO_AUTO_VALUE_ON_ZERO
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── MongoDB (destination / local dev mirror) ─────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: linksports_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: linksports
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?set MONGO_APP_PASSWORD}
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Mongo Express (optional web UI) ─────────────────────────────────────────
  mongo-express:
    image: mongo-express:latest
    container_name: linksports_mongo_express
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD}
      ME_CONFIG_MONGODB_URL: mongodb://admin:${MONGO_ROOT_PASSWORD}@mongo:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD:?set MONGO_EXPRESS_PASSWORD}

volumes:
  mysql_data:
  mongo_data:

# ─────────────────────────────────────────────────────────────────────────────
# After all containers are healthy, run the migration:
#
#   # From the backend directory:
#   MYSQL_HOST=127.0.0.1 MYSQL_USER=root MYSQL_PASSWORD=$MYSQL_ROOT_PASSWORD \
#   MYSQL_DATABASE=linksports \
#   MONGODB_URI=mongodb://admin:$MONGO_ROOT_PASSWORD@127.0.0.1:27017/linksports?authSource=admin \
#   node scripts/migrate_mysql_to_mongo.js
#
# Or set these values in your .env:
#   MYSQL_HOST=127.0.0.1
#   MYSQL_PORT=3306
#   MYSQL_USER=root
#   MYSQL_PASSWORD=<your MYSQL_ROOT_PASSWORD>
#   MYSQL_DATABASE=linksports
#   MONGODB_URI=mongodb://admin:$MONGO_ROOT_PASSWORD@127.0.0.1:27017/linksports?authSource=admin
# ─────────────────────────────────────────────────────────────────────────────
